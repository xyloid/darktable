[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "darktable-mcp"
version = "0.1.0"
description = "MCP sidecar for darktable's private remote-edit protocol (read and mutation tools)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "darktable developers" }]
keywords = ["darktable", "mcp", "model-context-protocol", "photography", "raw"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Graphics :: Editors",
]

[project.urls]
Homepage = "https://www.darktable.org/"
Source = "https://github.com/darktable-org/darktable"
Documentation = "https://github.com/darktable-org/darktable/blob/master/tools/mcp/docs/remote-control.md"

# `mcp` version range: floor is the exact version this package was
# developed and tested against (1.28.1); ceiling excludes the next major,
# since the SDK's own versioning policy is not documented as strictly
# semver-stable across majors. Bump the floor deliberately, in the same
# commit as any code changes the newer SDK requires.
dependencies = [
  "mcp>=1.28.1,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
]

[project.scripts]
darktable-mcp = "darktable_mcp.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# The live, Xvfb-backed end-to-end suite under tests/integration/ is marked
# `integration` and DESELECTED by default so the fast unit suite stays fast
# and needs no darktable build. Run it explicitly with `pytest -m integration`
# (the trailing `-m` on the command line overrides this default).
addopts = "-m 'not integration'"
markers = [
  "integration: live end-to-end test; launches a real darktable GUI under a display server (Xvfb or an inherited $DISPLAY) and drives it over the remote-edit protocol. Deselected by default; skips loudly when a GUI build or display is missing.",
]
